<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="frame-ancestors *;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵洛神de小曲</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1040 30%, #0d1b2a 70%, #0a0e27 100%);
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    color: #e0d6c8;
    overflow-x: hidden;
  }

  /* 背景粒子效果 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,215,0,0.3), transparent),
      radial-gradient(1px 1px at 30% 50%, rgba(200,180,255,0.2), transparent),
      radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,200,100,0.3), transparent),
      radial-gradient(1px 1px at 70% 40%, rgba(180,200,255,0.2), transparent),
      radial-gradient(1px 1px at 90% 80%, rgba(255,215,0,0.2), transparent),
      radial-gradient(1.5px 1.5px at 20% 70%, rgba(200,160,255,0.2), transparent),
      radial-gradient(1px 1px at 60% 90%, rgba(255,180,50,0.2), transparent),
      radial-gradient(1px 1px at 80% 15%, rgba(150,200,255,0.2), transparent);
    animation: twinkle 8s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes twinkle {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 30px 20px;
  }

  /* 标题区域 */
  .header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeInDown 1s ease-out;
  }

  .header h1 {
    font-size: 2.2em;
    background: linear-gradient(135deg, #f0c27f, #ffd700, #f0c27f);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    letter-spacing: 6px;
    margin-bottom: 8px;
  }

  .header .subtitle {
    font-size: 0.95em;
    color: #8a7e6e;
    letter-spacing: 3px;
  }

  .header .divider {
    width: 200px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #b8860b, transparent);
    margin: 15px auto;
  }

  /* 当前播放信息 */
  .now-playing {
    background: rgba(20, 15, 45, 0.8);
    border: 1px solid rgba(184, 134, 11, 0.3);
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 30px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
    animation: fadeIn 1.2s ease-out;
  }

  .now-playing .label {
    font-size: 0.75em;
    color: #b8860b;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .now-playing .track-name {
    font-size: 1.6em;
    color: #ffd700;
    margin-bottom: 5px;
    letter-spacing: 2px;
  }

  .now-playing .track-character {
    font-size: 1em;
    color: #a89b8c;
  }

  /* 进度条 */
  .progress-container {
    margin: 18px 0 10px;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #b8860b, #ffd700);
    border-radius: 3px;
    transition: width 0.1s linear;
    box-shadow: 0 0 8px rgba(255,215,0,0.4);
  }

  .time-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.8em;
    color: #6a5e4e;
    margin-top: 5px;
  }

  /* 控制按钮 */
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 20px;
  }

  .btn {
    background: none;
    border: 1px solid rgba(184,134,11,0.4);
    color: #c9b99a;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    font-size: 1.2em;
  }

  .btn:hover {
    border-color: #ffd700;
    color: #ffd700;
    box-shadow: 0 0 15px rgba(255,215,0,0.2);
    transform: scale(1.05);
  }

  .btn-play {
    width: 64px;
    height: 64px;
    font-size: 1.6em;
    background: linear-gradient(135deg, rgba(184,134,11,0.2), rgba(255,215,0,0.1));
    border-color: rgba(255,215,0,0.5);
    color: #ffd700;
  }

  .btn-play:hover {
    background: linear-gradient(135deg, rgba(184,134,11,0.35), rgba(255,215,0,0.2));
    box-shadow: 0 0 25px rgba(255,215,0,0.3);
  }

  /* 音量控制 */
  .volume-control {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 15px;
    justify-content: center;
  }

  .volume-control label {
    font-size: 0.85em;
    color: #8a7e6e;
  }

  .volume-slider {
    -webkit-appearance: none;
    width: 120px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ffd700;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(255,215,0,0.4);
  }

  /* 播放列表 */
  .playlist {
    background: rgba(20, 15, 45, 0.6);
    border: 1px solid rgba(184, 134, 11, 0.2);
    border-radius: 16px;
    overflow: hidden;
    backdrop-filter: blur(10px);
    animation: fadeInUp 1.4s ease-out;
  }

  .playlist-header {
    padding: 18px 25px;
    border-bottom: 1px solid rgba(184,134,11,0.2);
    font-size: 1em;
    color: #b8860b;
    letter-spacing: 3px;
  }

  .track-item {
    display: flex;
    align-items: center;
    padding: 14px 25px;
    cursor: pointer;
    transition: all 0.3s ease;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    position: relative;
  }

  .track-item:last-child {
    border-bottom: none;
  }

  .track-item:hover {
    background: rgba(184,134,11,0.08);
  }

  .track-item.active {
    background: rgba(184,134,11,0.12);
  }

  .track-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, #b8860b, #ffd700);
  }

  .track-item .track-num {
    width: 32px;
    font-size: 0.85em;
    color: #6a5e4e;
    font-family: 'Courier New', monospace;
  }

  .track-item.active .track-num {
    color: #ffd700;
  }

  .track-item .track-info {
    flex: 1;
  }

  .track-item .track-title {
    font-size: 1.05em;
    color: #d4c5b0;
    margin-bottom: 2px;
    transition: color 0.3s;
  }

  .track-item.active .track-title {
    color: #ffd700;
  }

  .track-item .track-desc {
    font-size: 0.8em;
    color: #6a5e4e;
  }

  .track-item .track-status {
    width: 24px;
    text-align: center;
    font-size: 0.9em;
    color: #6a5e4e;
  }

  .track-item.active .track-status .playing-icon {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 16px;
  }

  .track-item.active .track-status .playing-icon span {
    display: inline-block;
    width: 3px;
    background: #ffd700;
    border-radius: 1px;
    animation: equalize 0.8s ease-in-out infinite alternate;
  }

  .track-item.active .track-status .playing-icon span:nth-child(1) { height: 60%; animation-delay: 0s; }
  .track-item.active .track-status .playing-icon span:nth-child(2) { height: 100%; animation-delay: 0.2s; }
  .track-item.active .track-status .playing-icon span:nth-child(3) { height: 40%; animation-delay: 0.4s; }

  @keyframes equalize {
    0% { height: 30%; }
    100% { height: 100%; }
  }

  /* 底部信息 */
  .footer {
    text-align: center;
    margin-top: 30px;
    padding: 15px;
    color: #4a3e2e;
    font-size: 0.8em;
    letter-spacing: 2px;
  }

  /* 动画 */
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* 响应式 */
  @media (max-width: 600px) {
    .header h1 { font-size: 1.6em; }
    .now-playing { padding: 18px; }
    .track-item { padding: 12px 15px; }
    .controls { gap: 12px; }
    .btn { width: 42px; height: 42px; }
    .btn-play { width: 56px; height: 56px; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- 标题 -->
  <div class="header">
    <h1>世葉定制音乐播放器</h1>
    <div class="divider"></div>
    <div class="subtitle">曲目源自喵洛神</div>
  </div>

  <!-- 当前播放 -->
  <div class="now-playing">
    <div class="label">▶ 正在播放</div>
    <div class="track-name" id="currentTitle">暂未播放音频</div>
    <div class="track-character" id="currentCharacter"></div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-info">
        <span id="currentTime">00:00</span>
        <span id="duration">00:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="btnPrev" title="上一曲">⏮</button>
      <button class="btn btn-play" id="btnPlay" title="播放/暂停">▶</button>
      <button class="btn" id="btnNext" title="下一曲">⏭</button>
    </div>

    <div class="volume-control">
      <label>🔊</label>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
    </div>
  </div>

  <!-- 播放列表 -->
  <div class="playlist">
    <div class="playlist-header">📜 曲目列表</div>
    <div id="playlistContainer"></div>
  </div>

  <div class="footer">
    世葉QQ：1365460741
  </div>
</div>

<audio id="audioPlayer" preload="metadata"></audio>

<script>
const tracks = [
  {
    title: "太平",
    character: "张角 · 大贤良师",
    desc: "雷击电闪，天下大变！太平天术，一统天下！",
    url: "https://link.hhtjim.com/163/3382155679.mp3"
  },
  {
    title: "夜冕",
    character: "曹丕 · 大魏文帝",
    desc: "千秋万载，一统江山！仙福永享，寿与天齐！",
    url: "https://link.hhtjim.com/163/3369771953.mp3"
  },
  {
    title: "逐日",
    character: "姜维 · 炎志灼心",
    desc: "效逐日之夸父，怀忠志而长存。知天命而不顺，履穷途而强为。",
    url: "https://link.hhtjim.com/163/3366381357.mp3"
  },
  {
    title: "窃天",
    character: "钟会 · 风雪前行",
    desc: "今日之举，不过权计。韬光养晦，再夺天时。",
    url: "https://link.hhtjim.com/163/3367219333.mp3"
  },
  {
    title: "乱武",
    character: "贾诩 · 权倾龙廷",
    desc: "我欲问鼎天下，试问谁与争锋？",
    url: "https://link.hhtjim.com/163/3359643639.mp3"
  },
  {
    title: "狼顾",
    character: "司马懿 · 狼顾之鬼",
    desc: "天命由我来定。",
    url: "https://link.hhtjim.com/163/3359721739.mp3"
  },
  {
    title: "安澜",
    character: "陆逊 · 儒生将才",
    desc: "锦绣山河，尽归朕有。四海内外，皆在我手中。",
    url: "https://link.hhtjim.com/163/3367778705.mp3"
  },
  {
    title: "窥鼎",
    character: "司马昭 · 蓄势待发",
    desc: "司马昭之心，路人皆知。",
    url: "https://link.hhtjim.com/163/3374162929.mp3"
  },
  {
    title: "夜权",
    character: "司马师 · 暗中掌权",
    desc: "夜幕之下，权倾朝野。",
    url: "https://link.hhtjim.com/163/3417891336.mp3"
  }
];

let currentIndex = -1;
let isPlaying = false;

const audio = document.getElementById('audioPlayer');
const btnPlay = document.getElementById('btnPlay');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const currentTimeEl = document.getElementById('currentTime');
const durationEl = document.getElementById('duration');
const volumeSlider = document.getElementById('volumeSlider');
const currentTitle = document.getElementById('currentTitle');
const currentCharacter = document.getElementById('currentCharacter');
const playlistContainer = document.getElementById('playlistContainer');

// 初始化播放列表
function renderPlaylist() {
  playlistContainer.innerHTML = tracks.map((track, i) => `
    <div class="track-item" data-index="${i}">
      <div class="track-num">${String(i + 1).padStart(2, '0')}</div>
      <div class="track-info">
        <div class="track-title">${track.title}</div>
        <div class="track-desc">${track.character} — ${track.desc}</div>
      </div>
      <div class="track-status">
        <div class="playing-icon" style="display:none;">
          <span></span><span></span><span></span>
        </div>
        <span class="status-text">♪</span>
      </div>
    </div>
  `).join('');

  // 绑定点击事件
  document.querySelectorAll('.track-item').forEach(item => {
    item.addEventListener('click', () => {
      const idx = parseInt(item.dataset.index);
      playTrack(idx);
    });
  });
}

// 播放指定曲目
function playTrack(index) {
  if (index < 0) index = tracks.length - 1;
  if (index >= tracks.length) index = 0;

  currentIndex = index;
  const track = tracks[index];

  audio.src = track.url;
  audio.load();

  // 更新当前播放信息
  currentTitle.textContent = track.title;
  currentCharacter.textContent = track.character;

  // 更新列表高亮
  document.querySelectorAll('.track-item').forEach((item, i) => {
    item.classList.toggle('active', i === index);
    const icon = item.querySelector('.playing-icon');
    const text = item.querySelector('.status-text');
    if (i === index) {
      icon.style.display = 'inline-flex';
      text.style.display = 'none';
    } else {
      icon.style.display = 'none';
      text.style.display = 'inline';
    }
  });

  audio.play().then(() => {
    isPlaying = true;
    btnPlay.textContent = '⏸';
  }).catch(err => {
    console.error('播放失败:', err);
    currentTitle.textContent = '播放失败，请检查网络';
  });
}

// 播放/暂停
function togglePlay() {
  if (currentIndex === -1) {
    playTrack(0);
    return;
  }
  if (isPlaying) {
    audio.pause();
    isPlaying = false;
    btnPlay.textContent = '▶';
  } else {
    audio.play().then(() => {
      isPlaying = true;
      btnPlay.textContent = '⏸';
    });
  }
}

// 更新进度条
audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const percent = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = percent + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
    durationEl.textContent = formatTime(audio.duration);
  }
});

// 点击进度条跳转
progressBar.addEventListener('click', (e) => {
  if (!audio.duration) return;
  const rect = progressBar.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percent * audio.duration;
});

// 上一曲/下一曲
btnPrev.addEventListener('click', () => playTrack(currentIndex - 1));
btnNext.addEventListener('click', () => playTrack(currentIndex + 1));
btnPlay.addEventListener('click', togglePlay);

// 音量控制
volumeSlider.addEventListener('input', () => {
  audio.volume = volumeSlider.value / 100;
});
audio.volume = 0.8;

// 播放结束自动下一曲
audio.addEventListener('ended', () => playTrack(currentIndex + 1));

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') playTrack(currentIndex + 1);
  if (e.code === 'ArrowLeft') playTrack(currentIndex - 1);
});

// 格式化时间
function formatTime(seconds) {
  if (isNaN(seconds)) return '00:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

// 初始化
renderPlaylist();
</script>

</body>
</html>
