<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世葉NB</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #00d4ff; font-size: 28px; margin-bottom: 30px; text-shadow: 0 0 20px rgba(0,212,255,0.3); }

        /* ===== 输入区域 ===== */
        .input-area { display: flex; flex-direction: column; align-items: stretch; gap: 14px; margin-bottom: 30px; max-width: 400px; margin-left: auto; margin-right: auto; }
        input[type="text"] { width: 100%; padding: 12px 20px; font-size: 16px; border: 2px solid #333; border-radius: 8px; background: #1a1a2e; color: #fff; outline: none; transition: border-color 0.3s; text-align: center; }
        input[type="text"]:focus { border-color: #00d4ff; box-shadow: 0 0 10px rgba(0,212,255,0.2); }
        select.platform-select { width: 100%; padding: 12px 20px; font-size: 15px; border: 2px solid #333; border-radius: 8px; background: #1a1a2e; color: #fff; outline: none; transition: border-color 0.3s; text-align: center; cursor: pointer; appearance: none; -webkit-appearance: none; }
        select.platform-select:focus { border-color: #00d4ff; box-shadow: 0 0 10px rgba(0,212,255,0.2); }
        .query-btn { width: 100%; padding: 12px 40px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; background: linear-gradient(135deg, #00d4ff, #0090ff); color: #fff; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .query-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,212,255,0.4); }
        .query-btn:active { transform: translateY(0); }

        /* ===== 结果区域 ===== */
        .result-area { background: #1a1a2e; border: 1px solid #333; border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        .result-item { margin-bottom: 20px; }
        .result-item:last-child { margin-bottom: 0; }
        .result-label { font-size: 14px; color: #888; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .result-value { font-size: 18px; color: #00d4ff; word-break: break-all; line-height: 1.8; background: #12122a; padding: 15px 20px; border-radius: 8px; border-left: 4px solid #00d4ff; }
        .result-value.weapon-name { color: #ff9d00; border-left-color: #ff9d00; }
        .loading { text-align: center; color: #888; padding: 20px; }
        .error { text-align: center; color: #ff4444; padding: 20px; background: rgba(255,68,68,0.1); border-radius: 8px; }
        .note { margin-top: 30px; padding: 15px 20px; background: rgba(255,157,0,0.1); border-left: 4px solid #ff9d00; border-radius: 8px; font-size: 13px; color: #aaa; line-height: 1.6; }

        /* ===== 复制按钮（整行宽度大按钮） ===== */
        .copy-btn-row { margin-bottom: 12px; }
        .copy-btn { width: 100%; padding: 14px 20px; font-size: 16px; background: linear-gradient(135deg, #ff9d00, #ff6600); border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; letter-spacing: 2px; }
        .copy-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,157,0,0.4); }
        .copy-btn:active { transform: translateY(0); }
        .copy-btn.copied { background: linear-gradient(135deg, #4CAF50, #2E7D32); }

        /* ===== 武器列表 ===== */
        .weapon-list { list-style: none; padding: 0; }
        .weapon-list li { padding: 6px 12px; border-bottom: 1px solid #2a2a3e; font-size: 15px; line-height: 1.6; }
        .weapon-list li:last-child { border-bottom: none; }
        .weapon-list li .index { color: #666; margin-right: 8px; font-weight: bold; }
        .weapon-list li .name { color: #ff9d00; }
        .weapon-list li .unrecognized { color: #ff6666; font-size: 13px; margin-left: 6px; }

        /* ===== 分类标签（每把武器末尾显示，不同类型不同颜色） ===== */
        .weapon-list li .cat-tag {
            display: inline-block; margin-left: 10px; padding: 1px 8px; font-size: 12px;
            border-radius: 4px; vertical-align: middle; font-weight: bold; letter-spacing: 0.5px;
        }
        /* 冲锋枪 - 青绿 */
        .cat-tag.cat-submachine { color: #00e5a0; background: rgba(0,229,160,0.12); border: 1px solid rgba(0,229,160,0.35); }
        /* 步枪 - 天蓝 */
        .cat-tag.cat-rifle { color: #00b4ff; background: rgba(0,180,255,0.12); border: 1px solid rgba(0,180,255,0.35); }
        /* 狙击枪 - 紫 */
        .cat-tag.cat-sniper { color: #c77dff; background: rgba(199,125,255,0.12); border: 1px solid rgba(199,125,255,0.35); }
        /* 机枪 - 橙红 */
        .cat-tag.cat-machinegun { color: #ff6b35; background: rgba(255,107,53,0.12); border: 1px solid rgba(255,107,53,0.35); }
        /* 霰弹枪 - 金黄 */
        .cat-tag.cat-shotgun { color: #ffd60a; background: rgba(255,214,10,0.12); border: 1px solid rgba(255,214,10,0.35); }
        /* 手枪 - 粉 */
        .cat-tag.cat-pistol { color: #ff79c6; background: rgba(255,121,198,0.12); border: 1px solid rgba(255,121,198,0.35); }
        /* 近战武器 - 棕 */
        .cat-tag.cat-melee { color: #d4a373; background: rgba(212,163,115,0.12); border: 1px solid rgba(212,163,115,0.35); }
        /* 手雷 - 红 */
        .cat-tag.cat-grenade { color: #ff4d4d; background: rgba(255,77,77,0.12); border: 1px solid rgba(255,77,77,0.35); }
        /* 闪光弹 - 亮黄绿 */
        .cat-tag.cat-flash { color: #ccff33; background: rgba(204,255,51,0.12); border: 1px solid rgba(204,255,51,0.35); }
        /* 烟雾弹 - 灰蓝 */
        .cat-tag.cat-smoke { color: #90a4ae; background: rgba(144,164,174,0.12); border: 1px solid rgba(144,164,174,0.35); }
        /* 未知 - 深红 */
        .cat-tag.cat-unknown { color: #ff6666; background: rgba(255,102,102,0.12); border: 1px solid rgba(255,102,102,0.35); }
    </style>

        // ===== 武器分类映射（返回key，用于匹配CSS class） =====
        function getWeaponCategory(idStr) {
            if (idStr.startsWith('201010')) return '冲锋枪';
            if (idStr.startsWith('201020') || idStr.startsWith('201021')) return '步枪';
            if (idStr.startsWith('201030')) return '狙击枪';
            if (idStr.startsWith('201040')) return '机枪';
            if (idStr.startsWith('201050')) return '霰弹枪';
            if (idStr.startsWith('202010')) return '手枪';
            if (idStr.startsWith('203010')) return '近战武器';
            // HK69榴弹-龙骑(ID:20401902)等榴弹类统一归为手雷
            if (idStr.startsWith('204010') || idStr.startsWith('204019')) return '手雷';
            if (idStr.startsWith('204020')) return '闪光弹';
            if (idStr.startsWith('204030')) return '烟雾弹';
            return '未知';
        }

        // 分类显示顺序
        const categoryOrder = [
            '冲锋枪', '步枪', '狙击枪', '机枪', '霰弹枪',
            '手枪', '近战武器', '手雷', '闪光弹', '烟雾弹', '未知'
        ];

        // 分类 → CSS class 后缀映射
        const categoryClassMap = {
            '冲锋枪': 'cat-submachine',
            '步枪': 'cat-rifle',
            '狙击枪': 'cat-sniper',
            '机枪': 'cat-machinegun',
            '霰弹枪': 'cat-shotgun',
            '手枪': 'cat-pistol',
            '近战武器': 'cat-melee',
            '手雷': 'cat-grenade',
            '闪光弹': 'cat-flash',
            '烟雾弹': 'cat-smoke',
            '未知': 'cat-unknown'
        };

        async function queryData() {
            const userId = document.getElementById('userId').value.trim();
            if (!userId) { alert('请输入主页ID'); return; }
            // 读取用户选择的区服代码
            const platform = document.getElementById('platformSelect').value || '1011';
            const rmbValue = document.getElementById('rmbValue');
            const weaponNameValue = document.getElementById('weaponNameValue');
            const copyBtn = document.getElementById('copyBtn');
            rmbValue.textContent = '查询中...';
            weaponNameValue.innerHTML = '<div class="loading">查询中...</div>';
            copyBtn.textContent = '复制';
            copyBtn.classList.remove('copied');
            const url = `https://qmqs-tscf1.dooyue.cn/queryts/query_all?id=${userId}&cmd=SEARCH&platform=${platform}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                rmbValue.textContent = data.rmb !== undefined ? data.rmb : '请输入正确的ID';
                const weaponList = data.weaponIDList || [];
                if (Array.isArray(weaponList) && weaponList.length > 0) {
                    // 按分类分组（保持分类顺序）
                    const groups = {};
                    weaponList.forEach((id, index) => {
                        const idStr = String(id);
                        const cat = getWeaponCategory(idStr);
                        if (!groups[cat]) groups[cat] = [];
                        const name = weaponIdMap[idStr] || null;
                        groups[cat].push({ index: index + 1, id: idStr, name });
                    });

                    let html = '<ul class="weapon-list">';
                    let globalIdx = 0;
                    categoryOrder.forEach(cat => {
                        if (!groups[cat] || groups[cat].length === 0) return;
                        groups[cat].forEach(item => {
                            globalIdx++;
                            html += '<li>';
                            html += `<span class="index">${globalIdx}.</span>`;
                            if (item.name) {
                                html += `<span class="name">${item.name}</span>`;
                            } else {
                                html += '<span class="name">[未识别]</span>';
                                html += `<span class="unrecognized">(ID: ${item.id})</span>`;
                            }
                            const tagClass = 'cat-tag ' + (categoryClassMap[cat] || 'cat-unknown');
                            html += `<span class="${tagClass}">${cat}</span>`;
                            html += '</li>';
                        });
                    });
                    html += '</ul>';
                    weaponNameValue.innerHTML = html;
                } else {
                    weaponNameValue.innerHTML = '<div class="loading">无武器数据</div>';
                }
            } catch (err) {
                rmbValue.textContent = '查询失败';
                weaponNameValue.innerHTML = `<div class="error">请求失败: ${err.message}<br>请检查网络连接</div>`;
            }
        }

        function copyWeapons() {
            const lis = document.querySelectorAll('#weaponNameValue .weapon-list li');
            let text = '';
            lis.forEach((li, i) => {
                const nameEl = li.querySelector('.name');
                const unrecEl = li.querySelector('.unrecognized');
                const tagEl = li.querySelector('.cat-tag');
                const name = nameEl ? nameEl.textContent : '';
                const unrec = unrecEl ? ' ' + unrecEl.textContent : '';
                const tag = tagEl ? ' [' + tagEl.textContent + ']' : '';
                text += `${i + 1}. ${name}${unrec}${tag}\n`;
            });
            if (!text.trim()) return;
            navigator.clipboard.writeText(text.trim()).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.textContent = '已复制!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = '复制';
                    copyBtn.classList.remove('copied');
                }, 1500);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text.trim();
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.textContent = '已复制!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = '复制';
                    copyBtn.classList.remove('copied');
                }, 1500);
            });
        }

        document.getElementById('userId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') queryData();
        });
    </script>
